# VoltBot settings. Secrets (tokens) go in .env, not here.
# Discord IDs: turn on Developer Mode in Discord, then right-click a user or channel.

# Users who may run admin commands.
admins = []

# The server voltgpt ran in. Its movie wheel game is imported into this server.
# main_server = 122962330165313536

# The SQLite database file.
database = "voltbot.db"

# voltgpt's database. If this file exists on startup, reminders and the movie wheel are
# imported once, then the file is renamed to old.db.imported.
old_database = "old.db"

[logging]
# Channel that receives warnings, errors, and start/stop notices.
# discord_channel = 123456789012345678
# Lowest level posted there: "error", "warn" or "info".
discord_level = "warn"

# Model settings. The OpenAI key goes in .env (OPENAI_TOKEN).
[ai.openai]
model = "gpt-6.1-sol"
# "none", "low", "medium", "high" or "xhigh".
reasoning_effort = "medium"
# How long answers are: "low", "medium" or "high".
verbosity = "low"
# Leave out for the account's default.
service_tier = "fast"

# Every feature has a section. These keys work in all of them:
#   enabled = false                   turn the feature off
#   guilds = [id, ...]                only in these servers
#   deny_guilds = [id, ...]           never in these servers
#   channels = [id, ...]              only in these channels
#   deny_channels = [id, ...]         never in these channels

[features.chat]
# Answers @-mentions that no other feature claimed.
enabled = true
# Now and then Vivy reads the last 25 messages and chimes in with one line, a question,
# an emoji reaction, or nothing. The chance per message (0 turns it off), and how long a
# channel waits before she considers it again.
chime_chance = 0.03
chime_cooldown_minutes = 60

[features.reminders]
enabled = true

[features.wheel]
# The movie wheel betting game. Admin actions use `admins` above.
# guilds = [122962330165313536]

[features.memory]
# Notes Vivy keeps between conversations, through chat's `memory` tool and /memory.
# Once a day, each server whose memory changed gets a reflection: Vivy tidies the folder
# and updates her notes about herself and her mood, which sets her Discord status.
enabled = true
# Channels where Vivy posts a weekly diary entry about her week in that server.
# diary_channels = [123456789012345678]

[features.snails]
# Repost detection. New messages' links and pictures are saved as they arrive; right-click a
# message → Apps → Check Snail lists earlier posts of the same link or picture.
# Older history is only read when an admin runs `/snail_backfill start`.
enabled = true

[features.control_panel]
# Channel with the status message the bot keeps up to date.
# status_channel = 123456789012345678
status_interval_secs = 60
