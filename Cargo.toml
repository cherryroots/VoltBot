[package]
name = "voltbot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22"
chrono = "0.4.45"
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
dotenvy = "0.15.7"
poise = "0.7.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
resvg = "0.48"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = "0.12.5"
sysinfo = "0.39.6"
tempfile = "3.27.0"
text-splitter = { version = "0.33.0", features = ["markdown"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rusqlite = "0.8.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
winnow = "1.0.4"
